spring.application.name=transporter-assignment

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true


# JWT configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Initial admin registration
security.bootstrap-secret=${ADMIN_BOOTSTRAP_SECRET}

# Actuator health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# OpenAPI configuration will be added in the configuration phase